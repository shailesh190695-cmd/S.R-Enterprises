<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R. ENTERPRISES</title>
    <style>
        /* NORMAL PROFESSIONAL THEME */
        :root { --main-bg: #f8fafc; --header-bg: #ffffff; --primary: #1e40af; --gold: #b45309; --text: #334155; }
        body { font-family: 'Arial', sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding: 0; }
        
        /* HEADER */
        .header { background: var(--header-bg); padding: 20px; text-align: center; border-bottom: 2px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header h1 { margin: 0; color: var(--primary); font-size: 24px; letter-spacing: 1px; }

        /* PRODUCT GALLERY (22 ITEMS) */
        .container { padding: 15px; max-width: 1200px; margin: auto; }
        .search-bar { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background: white; border-radius: 10px; padding: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .product-card img { width: 100%; height: 120px; object-fit: contain; background: #f1f5f9; border-radius: 8px; }
        .product-card h3 { font-size: 14px; margin: 10px 0 5px; color: #1e293b; }
        .product-card .price { color: #059669; font-weight: bold; margin-bottom: 10px; }
        .wa-btn { background: #25d366; color: white; text-decoration: none; padding: 8px; border-radius: 5px; display: block; font-size: 12px; font-weight: bold; }

        /* ADMIN BUTTON */
        .admin-entry { text-align: center; margin: 40px 0; }
        .admin-btn { background: none; border: 1px solid #cbd5e1; color: #94a3b8; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h1>S.R. ENTERPRISES</h1>
</div>

<div class="container">
    <input type="text" class="search-bar" placeholder="🔍 Search Spare Parts (Belt, Roller, Heater)...">
    
    <div class="product-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150?text=Teflon+Belt" alt="Teflon Belt">
            <h3>Teflon Belt 450</h3>
            <div class="price">₹ 1,200</div>
            <a href="https://wa.me/919324545155?text=Mujhe Teflon Belt 450 chahiye" class="wa-btn">WhatsApp Order 📲</a>
        </div>
        
        <div class="product-card">
            <img src="https://via.placeholder.com/150?text=Silicon+Roller" alt="Silicon Roller">
            <h3>Silicon Roller</h3>
            <div class="price">₹ 2,500</div>
            <a href="https://wa.me/919324545155?text=Mujhe Silicon Roller chahiye" class="wa-btn">WhatsApp Order 📲</a>
        </div>

        </div>

    <div class="admin-entry">
        <button class="admin-btn" onclick="location.href='admin.html'">Admin Login</button>
    </div>
</div>

</body>
</html>
