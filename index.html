<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R. Enterprises - Admin Access</title>
    <style>
        /* Design jo sirf Login ke liye hai */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #000000); /* Professional Dark Theme */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 24px;
        }

        .login-card p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #2c3e50;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .login-btn {
            background: #2c3e50;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #34495e;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 11px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>S.R. Enterprises</h2>
        <p>Private Admin Portal</p>
        
        <div class="input-group">
            <label>USER ID</label>
            <input type="text" id="userid" placeholder="Apna ID dalein">
        </div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="pass" placeholder="Apna Password dalein">
        </div>

        <button class="login-btn" onclick="validateLogin()">DASHBOARD KHOLIYE</button>

        <div class="footer-text">
            © 2024 Shailesh Services | Secured by Firebase
        </div>
    </div>

    <script>
        function validateLogin() {
            var u = document.getElementById('userid').value;
            var p = document.getElementById('pass').value;

            // Modular Logic: Abhi hum isko simple rakh rahe hain, 
            // baad mein isko Firebase se connect karenge.
            if(u === "shailesh" && p === "sr123") {
                alert("Login Successful! Ab Dashboard khulega.");
                // Yahan se hum Dashboard page par redirect karenge
                // window.location.href = "dashboard.html"; 
            } else {
                alert("Galat ID ya Password! Phir se koshish karein.");
            }
        }
    </script>

</body>
</html>
