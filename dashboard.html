<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R. Enterprises - Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; }
        
        /* Sidebar Navigation */
        .sidebar { width: 250px; background: #2c3e50; height: 100vh; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { font-size: 18px; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .nav-item { padding: 12px; cursor: pointer; border-radius: 5px; transition: 0.3s; margin-bottom: 5px; }
        .nav-item:hover { background: #34495e; }
        .active-nav { background: #3498db !important; }

        /* Main Content Area */
        .main-content { margin-left: 270px; padding: 20px; width: 100%; }
        
        /* Modular Grid for 9 Boxes */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .box-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; cursor: pointer; transition: 0.3s; border-bottom: 4px solid #2c3e50; }
        .box-card:hover { transform: translateY(-5px); border-color: #3498db; }
        
        /* Customer Network Stats Styling */
        .network-bar { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-item { text-align: center; }
        .stat-item span { display: block; font-size: 24px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>S.R. ENTERPRISES</h2>
        <div class="nav-item active-nav" onclick="showDashboard()">Main Dashboard</div>
        <div class="nav-item" onclick="loadModule('customer')">Customers & Network</div>
        <div class="nav-item" onclick="loadModule('billing')">Billing & GST</div>
        <div class="nav-item" onclick="logout()">Logout</div>
    </div>

    <div class="main-content" id="main-display">
        <div id="dashboard-home">
            <h1>Control Panel</h1>
            <div class="grid-container">
                <div class="box-card" onclick="loadModule('billing')">💰 Billing & GST</div>
                <div class="box-card" onclick="loadModule('stock')">📦 Stock Master</div>
                <div class="box-card" onclick="loadModule('dealer')">🤝 Dealer Ledger</div>
                <div class="box-card" onclick="loadModule('expenses')">💸 Expenses</div>
                <div class="box-card" onclick="loadModule('customer')">👤 Customers & Network</div>
                <div class="box-card" onclick="loadModule('reports')">📊 Monthly Report</div>
                <div class="box-card" onclick="loadModule('summary')">📅 Yearly Summary</div>
                <div class="box-card" onclick="loadModule('orders')">📝 Orders</div>
                <div class="box-card" onclick="loadModule('settings')">⚙️ Settings</div>
            </div>
        </div>

        <div id="module-container" class="hidden"></div>
    </div>

    <script>
        // Line-by-Line Modular Logic
        function loadModule(moduleName) {
            document.getElementById('dashboard-home').style.display = 'none';
            const container = document.getElementById('module-container');
            container.style.display = 'block';

            if(moduleName === 'customer') {
                container.innerHTML = `
                    <h2>Network Location Control</h2>
                    <div class="network-bar">
                        <div class="stat-item"><span>150</span> Total Network</div>
                        <div class="stat-item"><span>85</span> Mumbai Network</div>
                        <div class="stat-item"><span>65</span> Outside Network</div>
                    </div>
                    <div style="background:white; padding:20px; border-radius:10px;">
                        <h3>Add New Network Connection</h3>
                        <input type="text" placeholder="Location/Area Name" style="width:30%; padding:10px; margin-right:10px;">
                        <input type="text" placeholder="Customer Mobile" style="width:30%; padding:10px; margin-right:10px;">
                        <button style="padding:10px 20px; background:#2c3e50; color:white; border:none; border-radius:5px; cursor:pointer;">Save to Network</button>
                    </div>
                    <br>
                    <button onclick="showDashboard()">Back to Control Panel</button>
                `;
            } else {
                container.innerHTML = `<h2>${moduleName} module par kaam chal raha hai...</h2><button onclick="showDashboard()">Back</button>`;
            }
        }

        function showDashboard() {
            document.getElementById('dashboard-home').style.display = 'block';
            document.getElementById('module-container').style.display = 'none';
        }

        function logout() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
